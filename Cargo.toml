[package]
authors = ["Lighter Contributors"]
categories = ["cryptography", "api-bindings"]
description = "Rust SDK for Lighter Protocol - A comprehensive trading library for blockchain"
edition = "2021"
keywords = ["blockchain", "trading", "lighter", "crypto", "defi"]
license = "MIT"
name = "lighter-rs"
repository = "https://github.com/0xvasanth/lighter-rs"
version = "0.1.1"

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
prefer-client-id = []
rustls-tls = [
  "reqwest/rustls",
  "tokio-tungstenite/rustls-tls-webpki-roots",
]

[dependencies]
# Serialization
serde = {version = "1", default-features = false, features = ["derive"]}
serde_json = {version = "1", default-features = false, features = ["alloc"]}

# HTTP Client
reqwest = {version = "0.13", default-features = false, features = ["json", "form"]}
tokio = {version = "1", default-features = false, features = ["full"]}

# WebSocket Client
futures-util = {version = "0.3", default-features = false}
tokio-tungstenite = {version = "0.29", default-features = false, features = ["connect"]}

# Cryptography
base64 = {version = "0.22", default-features = false}
hex = {version = "0.4", default-features = false, features = ["alloc"]}
sha2 = {version = "0.10", default-features = false}
# Poseidon cryptography for Lighter Protocol
goldilocks-crypto = {version = "0.1", default-features = false}
poseidon-hash = {version = "0.1", default-features = false}

# Error handling
anyhow = {version = "1", default-features = false}
thiserror = {version = "2", default-features = false}

# Logging
tracing = {version = "0.1", default-features = false}

# Time handling
chrono = {version = "0.4", default-features = false, features = ["now"]}

# Numeric types
num-bigint = {version = "0.4", default-features = false}
num-traits = {version = "0.2", default-features = false}

[dev-dependencies]
dotenv = {version = "0.15", default-features = false}
mockito = {version = "1", default-features = false}
tokio-test = {version = "0.4", default-features = false}
tracing-subscriber = {version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"]}

[lib]
name = "lighter_rs"
path = "src/lib.rs"
